<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="auto" style="background:#090D16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <marker id="seqArrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C9A96E"/>
    </marker>
    <marker id="seqArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="50" y="44" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="-0.02em">VoyageAI Request Lifecycle &amp; Fallback Sequence</text>
  <text x="50" y="68" fill="#94A3B8" font-size="12">Sequence Flow: Resilience Degradation from Search Grounding to Dynamic Model Recovery &amp; Offline Preview</text>

  <!-- Lifeline Columns (X coordinates) -->
  <!-- Col 1: Client (x=100) -->
  <!-- Col 2: Rate Limiter (x=270) -->
  <!-- Col 3: Dispatcher (x=440) -->
  <!-- Col 4: Gemini Strategy 1 & 2 (x=640) -->
  <!-- Col 5: Fallback Strategies 3 & 4 (x=850) -->

  <!-- Lifeline vertical dashes -->
  <line x1="110" y1="120" x2="110" y2="620" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>
  <line x1="280" y1="120" x2="280" y2="620" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>
  <line x1="470" y1="120" x2="470" y2="620" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>
  <line x1="680" y1="120" x2="680" y2="620" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>
  <line x1="880" y1="120" x2="880" y2="620" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>

  <!-- Column Headers -->
  <g transform="translate(45, 80)">
    <rect width="130" height="38" rx="8" fill="url(#headerBg)" stroke="#C9A96E" stroke-width="1.5"/>
    <text x="65" y="24" fill="#E8D5A8" font-size="12" font-weight="700" text-anchor="middle">💻 Client UI</text>
  </g>

  <g transform="translate(215, 80)">
    <rect width="130" height="38" rx="8" fill="url(#headerBg)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="65" y="24" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">🛡️ Rate Limiter</text>
  </g>

  <g transform="translate(405, 80)">
    <rect width="130" height="38" rx="8" fill="url(#headerBg)" stroke="#C9A96E" stroke-width="1.5"/>
    <text x="65" y="24" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">⚙️ Dispatcher</text>
  </g>

  <g transform="translate(610, 80)">
    <rect width="140" height="38" rx="8" fill="url(#headerBg)" stroke="#10B981" stroke-width="1.5"/>
    <text x="70" y="24" fill="#10B981" font-size="12" font-weight="700" text-anchor="middle">⚡ Gemini (Tiers 1-2)</text>
  </g>

  <g transform="translate(810, 80)">
    <rect width="140" height="38" rx="8" fill="url(#headerBg)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="70" y="24" fill="#A855F7" font-size="12" font-weight="700" text-anchor="middle">🔄 Fallbacks (Tiers 3-4)</text>
  </g>

  <!-- Step 1: POST /api/chat -->
  <line x1="110" y1="145" x2="275" y2="145" stroke="#C9A96E" stroke-width="1.8" marker-end="url(#seqArrowGold)"/>
  <text x="190" y="138" fill="#E8D5A8" font-size="10.5" font-weight="600" text-anchor="middle">1. POST /api/chat</text>

  <!-- Step 2: Rate check (Self) -->
  <rect x="250" y="160" width="60" height="24" rx="4" fill="#14233C" stroke="#38BDF8" stroke-width="1"/>
  <text x="280" y="176" fill="#38BDF8" font-size="9.5" text-anchor="middle">Token check</text>

  <!-- Conditional 429 branch (dashed) -->
  <line x1="275" y1="200" x2="115" y2="200" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#seqArrowRed)"/>
  <text x="190" y="195" fill="#EF4444" font-size="9.5" font-weight="600" text-anchor="middle">[If &gt;20 req/min] HTTP 429 (Retry-After)</text>

  <!-- Step 3: Forward to Dispatcher -->
  <line x1="280" y1="225" x2="465" y2="225" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#seqArrowBlue)"/>
  <text x="375" y="218" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">2. Allow Request</text>

  <!-- Step 4: Dispatcher sanitization & cap -->
  <rect x="420" y="240" width="100" height="26" rx="4" fill="#14233C" stroke="#C9A96E" stroke-width="1"/>
  <text x="470" y="257" fill="#E8D5A8" font-size="9.5" text-anchor="middle">history.slice(-15)</text>

  <!-- Step 5: Try Strategy 1 -->
  <line x1="470" y1="285" x2="675" y2="285" stroke="#10B981" stroke-width="1.8" marker-end="url(#seqArrowGreen)"/>
  <text x="575" y="278" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">3. Strategy 1 (Search Grounded)</text>

  <!-- Exception in Strategy 1 (e.g. Search Tool Quota / Region error) -->
  <rect x="635" y="305" width="90" height="24" rx="4" fill="#3B1219" stroke="#EF4444" stroke-width="1"/>
  <text x="680" y="321" fill="#FCA5A5" font-size="9.5" text-anchor="middle">Tool Exception</text>

  <!-- Step 6: Graceful degrade to Strategy 2 -->
  <line x1="680" y1="345" x2="680" y2="365" stroke="#38BDF8" stroke-width="1.8"/>
  <line x1="680" y1="365" x2="680" y2="380" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#seqArrowBlue)"/>
  <rect x="615" y="380" width="130" height="26" rx="4" fill="#14233C" stroke="#38BDF8" stroke-width="1"/>
  <text x="680" y="397" fill="#38BDF8" font-size="9.5" font-weight="600" text-anchor="middle">4. Strategy 2 (Standard Chat)</text>

  <!-- If startChat History fails -> Cascade to Strategy 3 -->
  <line x1="680" y1="420" x2="875" y2="420" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#seqArrowGold)"/>
  <text x="775" y="413" fill="#F59E0B" font-size="9.5" font-weight="600" text-anchor="middle">5. Strategy 3 (Direct Prompt)</text>

  <!-- If Model Deprecated -> Cascade to Strategy 4 -->
  <line x1="880" y1="440" x2="880" y2="465" stroke="#A855F7" stroke-width="1.8"/>
  <rect x="805" y="465" width="150" height="26" rx="4" fill="#14233C" stroke="#A855F7" stroke-width="1"/>
  <text x="880" y="482" fill="#A855F7" font-size="9.5" font-weight="600" text-anchor="middle">6. Strategy 4 (v1beta Discovery)</text>

  <!-- Success Response Path from Gemini back to Dispatcher -->
  <line x1="805" y1="510" x2="475" y2="510" stroke="#10B981" stroke-width="2" marker-end="url(#seqArrowGreen)"/>
  <text x="640" y="503" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">7. Valid Response Payload (2048 max tokens)</text>

  <!-- Offline Fallback (Keyless) Alternative Branch -->
  <line x1="470" y1="535" x2="470" y2="555" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="1.5"/>
  <rect x="380" y="555" width="180" height="24" rx="4" fill="#24141E" stroke="#EF4444" stroke-width="1"/>
  <text x="470" y="571" fill="#FCA5A5" font-size="9" text-anchor="middle">[If Keyless]: Deterministic Engine</text>

  <!-- Final Delivery back to Client -->
  <line x1="470" y1="600" x2="115" y2="600" stroke="#10B981" stroke-width="2.2" marker-end="url(#seqArrowGreen)"/>
  <text x="290" y="593" fill="#10B981" font-size="10.5" font-weight="700" text-anchor="middle">8. 200 OK: Marked + DOMPurify Progressive Render</text>
</svg>
