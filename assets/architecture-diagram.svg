<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="auto" style="background:#090D16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C9A96E" flood-opacity="0.4"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C9A96E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="44" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="-0.02em">VoyageAI System Architecture</text>
  <text x="50" y="68" fill="#94A3B8" font-size="12">Production End-to-End Topology: Client UI ➔ Token-Bucket Limiter ➔ Dispatcher ➔ 4-Tier Strategy Cascade</text>

  <!-- Connective Lines -->
  <!-- 1. Client to Rate Limiter -->
  <path d="M 170 200 L 225 200" stroke="#C9A96E" stroke-width="2" marker-end="url(#arrowGold)" fill="none"/>

  <!-- 2. Rate Limiter to Dispatcher -->
  <path d="M 375 200 L 430 200" stroke="#C9A96E" stroke-width="2" marker-end="url(#arrowGold)" fill="none"/>

  <!-- 3. Dispatcher to Strategy 1 -->
  <path d="M 590 170 C 640 170, 640 115, 680 115" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- 4. Dispatcher to Strategy 2 -->
  <path d="M 590 190 C 640 190, 640 190, 680 190" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>

  <!-- 5. Dispatcher to Strategy 3 -->
  <path d="M 590 210 C 640 210, 640 265, 680 265" stroke="#F59E0B" stroke-width="2" fill="none"/>

  <!-- 6. Dispatcher to Strategy 4 -->
  <path d="M 590 230 C 640 230, 640 340, 680 340" stroke="#A855F7" stroke-width="2" fill="none"/>

  <!-- 7. Keyless to Deterministic Fallback -->
  <path d="M 510 270 L 510 440 L 680 440" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- Return Path to Client -->
  <path d="M 940 220 L 970 220 L 970 540 L 105 540 L 105 270" stroke="url(#streamGrad)" stroke-width="2.5" stroke-dasharray="8,6" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="420" y="525" width="240" height="28" rx="6" fill="#0B1324" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="543" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle">Sanitized Markdown / JSON Stream</text>

  <!-- Node 1: Client UI -->
  <g transform="translate(40, 130)" filter="url(#cardShadow)">
    <rect width="130" height="140" rx="12" fill="url(#cardBg)" stroke="#C9A96E" stroke-width="1.5"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="rgba(201, 169, 110, 0.15)"/>
    <text x="26" y="33" font-size="14" text-anchor="middle" fill="#E8D5A8">💻</text>
    <text x="14" y="66" fill="#FFFFFF" font-size="13" font-weight="700">Client UI</text>
    <text x="14" y="86" fill="#94A3B8" font-size="10">Browser Frontend</text>
    <line x1="14" y1="96" x2="116" y2="96" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="112" fill="#CBD5E1" font-size="9.5">• Marked parser</text>
    <text x="14" y="126" fill="#CBD5E1" font-size="9.5">• DOMPurify sanitizer</text>
  </g>

  <!-- Node 2: Rate Limiter & Token Gate -->
  <g transform="translate(225, 130)" filter="url(#cardShadow)">
    <rect width="150" height="140" rx="12" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="26" y="33" font-size="14" text-anchor="middle" fill="#38BDF8">🛡️</text>
    <text x="14" y="66" fill="#FFFFFF" font-size="13" font-weight="700">Rate Limiter</text>
    <text x="14" y="86" fill="#38BDF8" font-size="10" font-weight="600">IP Token Bucket</text>
    <line x1="14" y1="96" x2="136" y2="96" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="112" fill="#CBD5E1" font-size="9.5">• Chat: 20 req / min</text>
    <text x="14" y="126" fill="#CBD5E1" font-size="9.5">• API: 60 req / min</text>
    <text x="14" y="140" fill="#94A3B8" font-size="9">• 429 Retry-After header</text>
  </g>

  <!-- Node 3: Backend Dispatcher -->
  <g transform="translate(430, 130)" filter="url(#cardShadow)">
    <rect width="160" height="140" rx="12" fill="url(#cardBg)" stroke="url(#goldGradient)" stroke-width="2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="rgba(201, 169, 110, 0.2)"/>
    <text x="26" y="33" font-size="14" text-anchor="middle" fill="#E8D5A8">⚙️</text>
    <text x="14" y="66" fill="#FFFFFF" font-size="13" font-weight="700">Server Dispatcher</text>
    <text x="14" y="86" fill="#E8D5A8" font-size="10" font-weight="600">Node / Express API</text>
    <line x1="14" y1="96" x2="146" y2="96" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="112" fill="#CBD5E1" font-size="9.5">• history.slice(-15)</text>
    <text x="14" y="126" fill="#CBD5E1" font-size="9.5">• maxOutput: 2048 tok</text>
    <text x="14" y="140" fill="#CBD5E1" font-size="9.5">• temp 0.7 | topP 0.9</text>
  </g>

  <!-- Cascade Container Box -->
  <rect x="670" y="70" width="290" height="420" rx="14" fill="#0C1527" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="685" y="95" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="0.05em">4-TIER STRATEGY CASCADE</text>

  <!-- Strategy 1: Search Grounding -->
  <g transform="translate(685, 110)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="8" fill="#14233C" stroke="#10B981" stroke-width="1.5"/>
    <text x="12" y="24" fill="#10B981" font-size="10" font-weight="700">STRATEGY 1 (Primary)</text>
    <text x="12" y="42" fill="#FFFFFF" font-size="12" font-weight="600">gemini-3.8-flash + Google Search</text>
    <text x="210" y="34" fill="#94A3B8" font-size="9" text-anchor="end">Grounding</text>
  </g>

  <!-- Strategy 2: Standard Multi-Turn Chat -->
  <g transform="translate(685, 185)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="8" fill="#14233C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="12" y="24" fill="#38BDF8" font-size="10" font-weight="700">STRATEGY 2 (Standard)</text>
    <text x="12" y="42" fill="#FFFFFF" font-size="12" font-weight="600">Direct Chat Session (startChat)</text>
    <text x="250" y="34" fill="#94A3B8" font-size="9" text-anchor="end">Bypasses Tools</text>
  </g>

  <!-- Strategy 3: Direct Prompt Synthesis -->
  <g transform="translate(685, 260)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="8" fill="#14233C" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="12" y="24" fill="#F59E0B" font-size="10" font-weight="700">STRATEGY 3 (Direct Prompt)</text>
    <text x="12" y="42" fill="#FFFFFF" font-size="12" font-weight="600">Flat Transcript Generation</text>
    <text x="250" y="34" fill="#94A3B8" font-size="9" text-anchor="end">Bypasses History</text>
  </g>

  <!-- Strategy 4: Dynamic Discovery Fallback -->
  <g transform="translate(685, 335)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="8" fill="#14233C" stroke="#A855F7" stroke-width="1.5"/>
    <text x="12" y="24" fill="#A855F7" font-size="10" font-weight="700">STRATEGY 4 (Model Discovery)</text>
    <text x="12" y="42" fill="#FFFFFF" font-size="12" font-weight="600">v1beta/models Discovery Pool</text>
    <text x="250" y="34" fill="#94A3B8" font-size="9" text-anchor="end">Dynamic Rank</text>
  </g>

  <!-- Offline / Zero-Downtime Preview Engine -->
  <g transform="translate(685, 415)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="8" fill="#1B1724" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="12" y="24" fill="#EF4444" font-size="10" font-weight="700">ZERO-DOWNTIME PREVIEW</text>
    <text x="12" y="42" fill="#FFFFFF" font-size="12" font-weight="600">Deterministic Itinerary Engine</text>
    <text x="250" y="34" fill="#EF4444" font-size="9" text-anchor="end">100% Uptime</text>
  </g>

  <!-- Bottom Legend / Verification Row -->
  <g transform="translate(50, 580)">
    <circle cx="6" cy="6" r="5" fill="#10B981"/>
    <text x="18" y="10" fill="#94A3B8" font-size="10">Search Grounded (~720ms TTFT)</text>

    <circle cx="210" cy="6" r="5" fill="#38BDF8"/>
    <text x="222" y="10" fill="#94A3B8" font-size="10">Multi-Turn Session</text>

    <circle cx="360" cy="6" r="5" fill="#F59E0B"/>
    <text x="372" y="10" fill="#94A3B8" font-size="10">Direct Synthesis</text>

    <circle cx="500" cy="6" r="5" fill="#A855F7"/>
    <text x="512" y="10" fill="#94A3B8" font-size="10">Dynamic Model Discovery</text>

    <circle cx="680" cy="6" r="5" fill="#EF4444"/>
    <text x="692" y="10" fill="#94A3B8" font-size="10">Deterministic Preview Mode (Keyless Fallback)</text>
  </g>
</svg>
